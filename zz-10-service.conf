# Runs the SDK server as the unprivileged openrgb account, listening on
# loopback only, with its configuration in its own state directory instead
# of the packaged /etc/openrgb.
[Service]
User=openrgb
Group=openrgb
ExecStart=
ExecStart=/usr/bin/openrgb --server --server-host 127.0.0.1 --noautoconnect --config /var/lib/openrgb
StateDirectory=openrgb
StateDirectoryMode=0700
RuntimeDirectoryMode=0700
ReadWritePaths=
ReadWritePaths=/var/lib/openrgb /run/openrgb
