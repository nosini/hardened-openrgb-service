# Host /run (D-Bus, user sessions, removable media) and /var are replaced by
# empty read-only tmpfs; the service's own state and runtime directories and
# the read-only udev database are bound back. Only directories are bound:
# under SELinux, systemd can't create single-file mount points in an empty
# tmpfs. /etc and /usr stay visible read-only for libraries and NSS.
[Service]
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateIPC=yes
ProtectProc=invisible
ProcSubset=pid
TemporaryFileSystem=/run:ro /var:ro
BindReadOnlyPaths=-/run/udev/data
BindPaths=/var/lib/openrgb -/run/openrgb
InaccessiblePaths=-/boot -/efi -/mnt -/media -/srv -/opt
# Nothing the service can write is executable, so it can't drop in a plugin.
NoExecPaths=/var/lib/openrgb -/run/openrgb /tmp /var/tmp
UMask=0077
