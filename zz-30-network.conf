# The only network use is the SDK listener on 127.0.0.1:6742 (IPv4 TCP).
# AF_UNIX is left out, which also blocks abstract Unix sockets; socketpair()
# still works. If the server fails to start at this step, add AF_UNIX back.
# AF_NETLINK stays for udev device enumeration and hotplug.
[Service]
RestrictAddressFamilies=
RestrictAddressFamilies=AF_INET AF_NETLINK
IPAddressAllow=
IPAddressAllow=127.0.0.1/32
IPAddressDeny=
IPAddressDeny=any
RestrictNetworkInterfaces=
RestrictNetworkInterfaces=lo
SocketBindAllow=
SocketBindAllow=ipv4:tcp:6742
SocketBindDeny=
SocketBindDeny=any
